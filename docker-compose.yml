# Docker Compose for local development and testing
version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: vims-db
    environment:
      POSTGRES_DB: vims_db
      POSTGRES_USER: vims_user
      POSTGRES_PASSWORD: vims_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vims_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Celery Broker
  redis:
    image: redis:7-alpine
    container_name: vims-redis
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Web Application (3 replicas for load balancing)
  web1:
    build: .
    container_name: vims-web1
    command: gunicorn vims.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 4 --timeout 60
    volumes:
      - .:/app
      - media_files:/app/media
      - static_files:/app/staticfiles
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://vims_user:vims_password@db:5432/vims_db
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DEBUG=True
      # Allow any host so mobile verify app can reach API at host IP (e.g. http://192.168.100.186:8000)
      - ALLOWED_HOSTS=*
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  web2:
    build: .
    container_name: vims-web2
    command: gunicorn vims.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 4 --timeout 60
    volumes:
      - .:/app
      - media_files:/app/media
      - static_files:/app/staticfiles
    environment:
      - DATABASE_URL=postgres://vims_user:vims_password@db:5432/vims_db
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DEBUG=True
      - ALLOWED_HOSTS=*
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web3:
    build: .
    container_name: vims-web3
    command: gunicorn vims.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 4 --timeout 60
    volumes:
      - .:/app
      - media_files:/app/media
      - static_files:/app/staticfiles
    environment:
      - DATABASE_URL=postgres://vims_user:vims_password@db:5432/vims_db
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DEBUG=True
      - ALLOWED_HOSTS=*
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Nginx Load Balancer
  # nginx:
  #   image: nginx:alpine
  #   container_name: vims-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - media_files:/app/media:ro
  #     - static_files:/app/staticfiles:ro
  #   depends_on:
  #     - web1
  #     - web2
  #     - web3

  # Celery Worker
  celery_worker:
    build: .
    container_name: vims-celery-worker
    command: celery -A vims worker -l info --concurrency=8 --max-tasks-per-child=1000
    volumes:
      - .:/app
      - media_files:/app/media
    environment:
      - DATABASE_URL=postgres://vims_user:vims_password@db:5432/vims_db
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery Beat (Scheduler)
  celery_beat:
    build: .
    container_name: vims-celery-beat
    command: celery -A vims beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgres://vims_user:vims_password@db:5432/vims_db
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  media_files:
  static_files:

